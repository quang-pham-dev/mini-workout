name: code-quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI on'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Turborepo quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required only for the optional Turborepo OIDC cache setup.

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Check package boundaries
        run: pnpm exec turbo boundaries

      - name: Check documentation
        run: pnpm docs:check

      - name: Run affected quality checks
        run: pnpm exec turbo run build lint check-types test --affected
