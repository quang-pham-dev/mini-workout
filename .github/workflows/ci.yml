name: code-quality

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI on'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Check formatting
        run: pnpm format

      - name: Run lint (affected)
        run: pnpm exec turbo run lint --affected

  typecheck-build:
    name: Type-check & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Build & type-check (affected)
        run: pnpm exec turbo run build check-types --affected

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Run tests (affected)
        run: pnpm exec turbo run test --affected

  storybook:
    name: Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Run Storybook lint
        run: pnpm --filter @mini-workout/storybook lint

      - name: Build Storybook
        run: pnpm --filter @mini-workout/storybook build

  boundaries-docs:
    name: Boundaries, docs & policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Turborepo remote cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Restore local Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Check package boundaries
        run: pnpm exec turbo boundaries

      - name: Check documentation
        run: pnpm docs:check

      - name: Run E2E policy tests
        run: pnpm --filter @mini-workout/e2e test

  admin-readiness:
    name: Admin artifact & disposable E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_workout_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_workout_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mini_workout_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mini_workout_e2e
      BETTER_AUTH_SECRET: ci-only-admin-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3002
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3001,http://localhost:3002
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Validate redacted environment contract
        run: pnpm --filter @mini-workout/admin check-env

      - name: Build admin Nitro artifact
        run: pnpm --filter @mini-workout/admin build

      - name: Verify Prisma client and Linux engine tracing
        run: pnpm --filter @mini-workout/admin check-artifact

      - name: Run admin unit coverage
        run: pnpm --filter @mini-workout/admin test:coverage

      - name: Install Chromium
        run: pnpm --filter @mini-workout/e2e exec playwright install --with-deps chromium

      - name: Run disposable admin E2E
        run: pnpm test:e2e -- --project=admin --project=admin-mobile

      - name: Upload sanitized Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
